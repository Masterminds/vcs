version: "2"

linters:
  default: none
  enable:
    - dupl
    - govet
    - ineffassign
    - nakedret
    - revive
    - staticcheck
    - unused
  settings:
    dupl:
      threshold: 400

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Masterminds/vcs
